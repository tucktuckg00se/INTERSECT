name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build every platform (useful for checking the ARM builds) without publishing.
  workflow_dispatch:

# Tag pushes stamp the tag's version into the build and publish a release. Manual runs from a
# branch let CMake fall back to its own version detection, name the zips after the branch, and
# skip the release job.
env:
  IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get version
        run: |
          if [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "PLUGIN_VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//' | sed 's/-rc\.[0-9]*//')" >> $GITHUB_ENV
          fi
          echo "ZIP_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DINTERSECT_VERSION=${{ env.PLUGIN_VERSION }}

      - name: Build
        run: cmake --build build --config Release --target Intersect_All

      - name: Package
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          mkdir staging
          cp -r "$ART_ROOT/VST3/INTERSECT.vst3" staging/
          cp -a "$ART_ROOT/Standalone/." staging/
          cd staging && 7z a ../INTERSECT-${{ env.ZIP_TAG }}-Windows-x64.zip *

      - uses: actions/upload-artifact@v5
        with:
          name: INTERSECT-Windows-x64
          path: INTERSECT-${{ env.ZIP_TAG }}-Windows-x64.zip

  build-windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get version
        run: |
          if ($env:IS_RELEASE_TAG -eq 'true') {
            $version = '${{ github.ref_name }}' -replace '^v', '' -replace '-rc\.\d+', ''
            "PLUGIN_VERSION=$version" >> $env:GITHUB_ENV
          }
          "ZIP_TAG=$('${{ github.ref_name }}' -replace '/', '-')" >> $env:GITHUB_ENV

      - name: Ensure CMake
        # Fall back to the CMake that ships inside Visual Studio if none is on PATH.
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $cmakeBin = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin'
            if (-not (Test-Path $cmakeBin)) { throw 'CMake not found on PATH or in Visual Studio' }
            $cmakeBin >> $env:GITHUB_PATH
          }

      - name: Configure
        run: cmake -B build -A ARM64 -DCMAKE_BUILD_TYPE=Release "-DINTERSECT_VERSION=${{ env.PLUGIN_VERSION }}"

      - name: Build
        run: cmake --build build --config Release --target Intersect_All

      - name: Package
        run: |
          $artRoot = 'build/Intersect_artefacts'
          if (Test-Path "$artRoot/Release") { $artRoot = "$artRoot/Release" }
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item -Recurse "$artRoot/VST3/INTERSECT.vst3" staging/
          Copy-Item -Recurse "$artRoot/Standalone/*" staging/
          # Fail early if the VST3 isn't an ARM64 bundle.
          if (-not (Test-Path 'staging/INTERSECT.vst3/Contents/arm64-win')) { throw 'VST3 has no arm64-win binary folder' }
          Compress-Archive -Path staging/* -DestinationPath "INTERSECT-${{ env.ZIP_TAG }}-Windows-arm64.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: INTERSECT-Windows-arm64
          path: INTERSECT-${{ env.ZIP_TAG }}-Windows-arm64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get version
        shell: bash
        run: |
          if [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "PLUGIN_VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//' | sed 's/-rc\.[0-9]*//')" >> $GITHUB_ENV
          fi
          echo "ZIP_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DINTERSECT_VERSION=${{ env.PLUGIN_VERSION }}

      - name: Build
        run: cmake --build build --config Release --target Intersect_All

      - name: Audit Linux ABI baseline
        shell: bash
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          bash .github/scripts/audit-linux-abi.sh "$ART_ROOT"

      - name: Package
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          mkdir staging
          cp -r "$ART_ROOT/VST3/INTERSECT.vst3" staging/
          cp -a "$ART_ROOT/Standalone/." staging/
          cd staging && zip -r ../INTERSECT-${{ env.ZIP_TAG }}-Linux-x64.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: INTERSECT-Linux-x64
          path: INTERSECT-${{ env.ZIP_TAG }}-Linux-x64.zip

  build-linux-arm64:
    # Same Ubuntu 22.04 base as x64, so the glibc 2.35 baseline carries over.
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get version
        shell: bash
        run: |
          if [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "PLUGIN_VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//' | sed 's/-rc\.[0-9]*//')" >> $GITHUB_ENV
          fi
          echo "ZIP_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DINTERSECT_VERSION=${{ env.PLUGIN_VERSION }}

      - name: Build
        run: cmake --build build --config Release --target Intersect_All

      - name: Audit Linux ABI baseline
        shell: bash
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          bash .github/scripts/audit-linux-abi.sh "$ART_ROOT"

      - name: Package
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          mkdir staging
          cp -r "$ART_ROOT/VST3/INTERSECT.vst3" staging/
          cp -a "$ART_ROOT/Standalone/." staging/
          test -d staging/INTERSECT.vst3/Contents/aarch64-linux
          cd staging && zip -r ../INTERSECT-${{ env.ZIP_TAG }}-Linux-arm64.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: INTERSECT-Linux-arm64
          path: INTERSECT-${{ env.ZIP_TAG }}-Linux-arm64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get version
        shell: bash
        run: |
          if [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "PLUGIN_VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//' | sed 's/-rc\.[0-9]*//')" >> $GITHUB_ENV
          fi
          echo "ZIP_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DINTERSECT_VERSION=${{ env.PLUGIN_VERSION }}

      - name: Build
        run: cmake --build build --config Release --target Intersect_All

      - name: Codesign
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          codesign --force --deep --sign - "$ART_ROOT/AU/INTERSECT.component"
          codesign --force --deep --sign - "$ART_ROOT/VST3/INTERSECT.vst3"
          codesign --force --deep --sign - "$ART_ROOT/Standalone/INTERSECT.app"

      - name: Package
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          mkdir staging
          cp -r "$ART_ROOT/VST3/INTERSECT.vst3" staging/
          cp -r "$ART_ROOT/Standalone/INTERSECT.app" staging/
          cp -r "$ART_ROOT/AU/INTERSECT.component" staging/
          cd staging && zip -r ../INTERSECT-${{ env.ZIP_TAG }}-macOS-arm64.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: INTERSECT-macOS-arm64
          path: INTERSECT-${{ env.ZIP_TAG }}-macOS-arm64.zip

  build-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get version
        shell: bash
        run: |
          if [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "PLUGIN_VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//' | sed 's/-rc\.[0-9]*//')" >> $GITHUB_ENV
          fi
          echo "ZIP_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DINTERSECT_VERSION=${{ env.PLUGIN_VERSION }}

      - name: Build
        run: cmake --build build --config Release --target Intersect_All

      - name: Codesign
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          codesign --force --deep --sign - "$ART_ROOT/AU/INTERSECT.component"
          codesign --force --deep --sign - "$ART_ROOT/VST3/INTERSECT.vst3"
          codesign --force --deep --sign - "$ART_ROOT/Standalone/INTERSECT.app"

      - name: Package
        run: |
          ART_ROOT=build/Intersect_artefacts
          if [ -d "$ART_ROOT/Release" ]; then
            ART_ROOT="$ART_ROOT/Release"
          fi
          mkdir staging
          cp -r "$ART_ROOT/VST3/INTERSECT.vst3" staging/
          cp -r "$ART_ROOT/Standalone/INTERSECT.app" staging/
          cp -r "$ART_ROOT/AU/INTERSECT.component" staging/
          cd staging && zip -r ../INTERSECT-${{ env.ZIP_TAG }}-macOS-x64.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: INTERSECT-macOS-x64
          path: INTERSECT-${{ env.ZIP_TAG }}-macOS-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-windows-arm64, build-linux, build-linux-arm64, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog for this version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          # Extract the section for this version from CHANGELOG.md
          # Matches from the version heading to the next heading (or EOF)
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # If no changelog section found, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ github.ref_name }}" > release_notes.md
          fi

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            artifacts/INTERSECT-Windows-x64/INTERSECT-${{ github.ref_name }}-Windows-x64.zip
            artifacts/INTERSECT-Windows-arm64/INTERSECT-${{ github.ref_name }}-Windows-arm64.zip
            artifacts/INTERSECT-Linux-x64/INTERSECT-${{ github.ref_name }}-Linux-x64.zip
            artifacts/INTERSECT-Linux-arm64/INTERSECT-${{ github.ref_name }}-Linux-arm64.zip
            artifacts/INTERSECT-macOS-arm64/INTERSECT-${{ github.ref_name }}-macOS-arm64.zip
            artifacts/INTERSECT-macOS-x64/INTERSECT-${{ github.ref_name }}-macOS-x64.zip
